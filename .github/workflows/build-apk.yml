name: Compilar Aplicativo Android (.APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Gerar APK do ORION
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK com Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Enterprise-App
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
